[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "PINNs_testbench"
description = "A testing and teaching ground for PINNs"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Micha Erkel", email = "micha.erkel@email.uni-freiburg.de" }
]
classifiers = [
    "Development Status :: Beta",
    "Programming Language :: Python"
]
requires-python = ">=3.9.0,<3.12.0"
dynamic = [ "version" ]
dependencies = [
    "ipykernel",
    "nbformat",
    "ipywidgets",
    "plotly",
    "pydot",
    "numpy",
    "tensorflow",
    "ray",
    "pandas",
    "pyarrow",
    "optuna",
    "hpbandster",
    "deepxde"
]

[project.optional-dependencies]
test = [
    "flake8",
    "pytest",
    "pytest-cov",
    "pytest-flake8"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[project.urls]
documentation = "https://imtek-simulation.github.io/python-skeleton/"
repository = "https://github.com/IMTEK-Simulation/PINNs_testbench"
changelog = "https://github.com/IMTEK-Simulation/PINNs_testbench/blob/main/CHANGELOG.md"
